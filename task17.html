<!DOCTYPE>
<html>
<head>
    <title>form</title>
</head>
<body>
    <h1>Doctor Appointment Form</h1>
    <label>Doctor appointment Date and time:</label>
    <input type="datetime-local" name="Doctor appointment Date and time" id="Doctor appointment Date and time"><br><br>
    <label>Month of Birth:</label>
    <input type="month" name="Month of Birth" id="Month of Birth"><br><br>
    <label>Week of birth:</label>
    <input type="week" name="Week of birth" id="Week of birth"><br><br>
    <label>Time of birth:</label>
    <input type="time" name="Time of birth" id="Time of birth"><br><br>
    <button>Book appointment</button>
</body>
</html>
